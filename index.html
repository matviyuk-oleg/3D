<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель на Сайті</title>
    
    <!-- Офіційний надійний скрипт від Google -->
   <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            text-align: center;
        }
        .model-container {
            width: 100%;
            max-width: 500px;
            height: 400px;
            margin: 20px auto;
            border: 2px dashed #bbb;
            border-radius: 10px;
            background-color: #fafafa;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Мій 3D Об'єкт</h1>

    <div class="model-container">
        <!-- Ваша модель з Meshy -->
        <model-viewer 
            src="model.glb" 
            alt="Моя 3D модель" 
            auto-rotate 
            camera-controls>
        </model-viewer>
    </div>

</body>
</html>
